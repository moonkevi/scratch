<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="/assets/images/favicon-32x32.png" type="image/x-icon">
    <title>Contact form main</title>
</head>
<body>
  <div class="container">
    <div class="main-cont">
        <h1>contact us</h1>
        <div class="name-field">
            <div class="form-group">
                <label for="name">first name <span>*</span></label>
                <input type="text" name="fname" id="name" required>
            </div>
            <div class="form-group">
                <label for="lname">last name <span>*</span></label>
                <input type="text" name="lname" id="lname" required>
            </div>
        </div>
        <div class="form-group">
            <label for="mail">email address <span>*</span></label>
            <input type="email" name="mail" id="mail" required>
        </div>
        <div class="query-option">
            <!-- <p class="query-par">query type</p>     -->
            <div class="form-group querry-1">
                
                <input type="radio" name="rad" id="rad" required>
                <label for="rad">general inquiry</label >
            </div>
            <div class="form-group querry-1">
                <input type="radio" name="rad" id="rad" required>
                <label for="rad">support request</label>
            </div>
        </div>
        <div class="form-group">
            <label for="textarea">message <span>*</span></label>
            <textarea name="textarea" id="textarea" required></textarea>
        </div>
        <div class="form-group box">
            <input type="checkbox" name="box" id="box">
            <p> I consent to being contacted by the team<span>*</span></p>
        </div>
        <button>submit</button>
    </div>
  </div>
</body>
</html>
